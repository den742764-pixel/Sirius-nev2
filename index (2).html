r-radius:10px;padding:0 6px;font-size:11px}.fd .on b{background:rgba(0,0,0,.35)}.cvr{height:112px;margin:-14px -14px 0;background:linear-gradient(135deg,#3b0a1a,#9b1a45);background-size:cover;background-position:center}.pav{margin:-54px auto 0;width:108px;padding:4px;border-radius:50%;background:conic-gradient(var(--ac),#a8405c,var(--ac));position:relative}.pav .av{width:100px;height:100px;font-size:42px;border:3px solid #0a0306}.stx{display:inline-block;margin:6px 0;padding:4px 12px;border-radius:14px;background:rgba(255,255,255,.08);font-size:13px}.subbar{position:sticky;bottom:6px;display:flex;gap:8px;padding:10px;border-radius:22px;margin-top:12px;z-index:3;background:rgba(14,3,8,.85)}.subbar .btn{flex:1}.ro .m:not(.st){background:rgba(80,12,36,.42)!important;backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border:1px solid rgba(255,170,200,.2)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 6px 18px rgba(0,0,0,.35)}.m.me:not(.st){background:linear-gradient(135deg,rgba(176,34,80,.62),rgba(168,28,68,.38))!important}#mic{touch-action:none;-webkit-user-select:none;user-select:none}.ro video,.ro audio{pointer-events:auto}#nts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;z-index:95;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}.nt{pointer-events:auto;width:min(92vw,420px);display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:22px;background:rgba(14,3,8,.78);animation:ni .3s}.nt b{display:block}.nt small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ni{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--c2),var(--ac));display:grid;place-items:center;flex:none}@keyframes ni{from{transform:translateY(-30px);opacity:0}}#tst{border-radius:22px!important}.ring .av{width:54px;height:54px;border:2px solid #000}

.sw.dn{color:#d4506c}.sw.dn .ri{background:linear-gradient(135deg,#7a1020,#9a1c3e)}

.ib:not(.gl):not(.btn){background:rgba(255,255,255,.08)}

.r1{--rc:#4da3ff}.r2{--rc:#b061ff}.r3{--rc:#ffc233}.r4{--rc:#ff3d6e}
.gft{text-align:center;padding:8px 18px;min-width:150px;border-radius:16px;border:1px solid var(--rc,var(--bd));box-shadow:inset 0 0 22px rgba(255,255,255,.04)}.gft .ge{font-size:60px;line-height:1.15;filter:drop-shadow(0 0 14px var(--rc,transparent))}.gft small{display:block;color:var(--rc,var(--mu))}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gk{border-radius:16px;padding:10px 4px;text-align:center;background:rgba(255,255,255,.05);border:1px solid var(--rc,var(--bd));cursor:pointer}.gk.r3,.gk.r4{box-shadow:0 0 14px var(--rc)}.gk .ge{font-size:34px}.gk small{display:block;color:var(--mu);font-size:11px}.gk small.rc{color:var(--rc,var(--mu))}

/* ================= Сириус 2.0 — обновление дизайна ================= */
:root{--ac2:#bf4a68;--ease:cubic-bezier(.2,.8,.2,1)}
body{background:radial-gradient(900px 560px at 12% -8%,#34081a,transparent 60%),radial-gradient(760px 520px at 100% 100%,#260612,transparent 60%),var(--bg)}
#amb{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#amb i{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform}
#amb i:nth-child(1){width:380px;height:380px;left:-120px;top:8%;background:#7a1236;opacity:.5;animation:amb1 22s ease-in-out infinite alternate}
#amb i:nth-child(2){width:340px;height:340px;right:-120px;bottom:6%;background:#8a1a3e;opacity:.3;animation:amb2 26s ease-in-out infinite alternate}
@keyframes amb1{to{transform:translate(90px,140px) scale(1.2)}}
@keyframes amb2{to{transform:translate(-100px,-120px) scale(1.15)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.55;transform:scale(1.08)}}
@keyframes orb{to{transform:translate(40px,26px) scale(1.25)}}
@keyframes shine{0%,55%{left:-80%}100%{left:130%}}
@keyframes sheetup{from{transform:translateY(40px);opacity:0}}
@keyframes fadein{from{opacity:0}}

/* навигация и списки */
nav{background:rgba(12,3,7,.8);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border-radius:30px;padding:7px 6px;transform:none;box-shadow:0 16px 40px rgba(0,0,0,.7),0 0 0 1px rgba(168,28,68,.12),inset 0 1px 0 rgba(255,255,255,.08)}
nav button{border-radius:22px;padding:7px 4px 5px;font-weight:500;transition:color .25s,transform .25s var(--ease),background .25s}
nav button.on{color:#fff;background:linear-gradient(180deg,rgba(168,28,68,.3),rgba(168,28,68,.07));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 22px rgba(168,28,68,.22)}
nav button.on svg{color:var(--ac2);filter:drop-shadow(0 0 6px rgba(168,28,68,.7))}
nav button:active{transform:scale(.92)}
.row{transition:transform .2s var(--ease),background .2s}.row:active{transform:scale(.985)}

/* кнопки */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:16px;padding:11px 16px;letter-spacing:.01em;transition:transform .2s var(--ease),box-shadow .25s,filter .25s;box-shadow:0 8px 20px rgba(168,28,68,.28),inset 0 1px 0 rgba(255,255,255,.22)}
.btn svg{width:18px;height:18px}.btn:active{transform:scale(.95)}
.btn.g{background:rgba(255,255,255,.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn.r{background:linear-gradient(135deg,#5a1020,#8e1a38);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.btn.g.on{background:linear-gradient(135deg,rgba(168,28,68,.35),rgba(255,143,176,.16));border-color:rgba(255,143,176,.42)}
.btn.sq{flex:none!important;width:46px;padding:0}
.pbig{width:100%;padding:14px 16px;font-size:16px;border-radius:18px}
.pbig:not(.r):after{content:"";position:absolute;top:0;bottom:0;width:55%;left:-80%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite;pointer-events:none}
input:focus,textarea:focus{border-color:rgba(168,28,68,.65);box-shadow:0 0 0 3px rgba(168,28,68,.16);background:rgba(255,255,255,.07)}

/* сообщения */
.m{border-radius:20px 20px 20px 6px;background:rgba(26,8,14,.9);box-shadow:0 4px 14px rgba(0,0,0,.28)}
.m.me{border-radius:20px 20px 6px 20px;background:linear-gradient(135deg,#8a1840,#8e1a3e);box-shadow:0 6px 18px rgba(168,28,68,.28)}

/* ====== ПРОФИЛЬ ====== */
.cvr,.dcv{background-size:cover;background-position:center;background-color:#2a0614;background-image:radial-gradient(140px 100px at 18% 30%,rgba(255,154,181,.7),transparent 70%),radial-gradient(180px 130px at 82% 18%,rgba(168,28,68,.9),transparent 70%),linear-gradient(135deg,#3b0a1a,#8e1a42 55%,#8e1a3e);position:relative;overflow:hidden}
.cvr i,.dcv i{position:absolute;border-radius:50%;filter:blur(26px);animation:orb 9s ease-in-out infinite alternate}
.cvr .o1,.dcv .o1{width:120px;height:120px;left:8%;top:10%;background:#a8405c;opacity:.5}
.cvr .o2,.dcv .o2{width:150px;height:150px;right:6%;top:-20%;background:#a81c44;opacity:.7;animation-duration:12s}
.cvr.has i{display:none}

 backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);

async function LDB(){const mem={},L={};let idb=null;const K='\u0001';

const put=(n,id,v)=>{try{idb&&idb.transaction('d','readwrite').objectStore('d').put(v,n+K+id)}catch(e){}},rm=(n,id)=>{try{idb&&idb.transaction('d','readwrite').objectStore('d').delete(n+K+id)}catch(e){}};
const snap=n=>({docs:Object.entries(mem[n]||{}).map(([id,v])=>({id,data:()=>v}))}),fire=n=>(L[n]||[]).forEach(f=>{try{f(snap(n))}catch(e){console.error(e)}});
return{collection:n=>({doc:id=>({
get:async()=>({id,exists:!!(mem[n]&&mem[n][id]),data:()=>(mem[n]||{})[id]}),
set:async v=>{(mem[n]=mem[n]||{})[id]=JSON.parse(JSON.stringify(v));put(n,id,mem[n][id]);fire(n)},
update:async v=>{const o=(mem[n]=mem[n]||{})[id]||{};mem[n][id]=JSON.parse(JSON.stringify({...o,...v}));put(n,id,mem[n][id]);fire(n)},
delete:async()=>{if(mem[n])delete mem[n][id];rm(n,id);fire(n)}}),
onSnapshot:f=>{(L[n]=L[n]||[]).push(f);setTimeout(()=>f(snap(n)),0);return()=>{L[n]=L[n].filter(x=>x!==f)}}})}}
/* Запасное хранилище для id/токена сессии в IndexedDB — чтобы аккаунт не «слетал» и не приходилось
   пересоздавать профиль, если WebView-обёртка APK чистит или не сохраняет localStorage (частая причина
   на Android), а IndexedDB при этом сохраняется. */
async function identDB(){try{return await new Promise((res,rej)=>{const r=indexedDB.open('sirius-id',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return null}}
async function identGet(db,k){if(!db)return null;try{return await new Promise(res=>{const rq=db.transaction('kv').objectStore('kv').get(k);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null)})}catch(e){return null}}
async function identSet(db,k,v){if(!db)return;try{db.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}
async function LUSER(){let id,tok;const rnd=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>b.toString(16).padStart(2,'0')).join('');
  const db=await identDB();
  try{id=localStorage.sid;tok=localStorage.stok}catch(e){}
  if(!id||!tok){const bid=await identGet(db,'sid'),btok=await identGet(db,'stok');if(bid&&btok){id=bid;tok=btok}}/* нашлись в IndexedDB — не создаём новый аккаунт */
  if(!id)id='u'+Date.now().toString(36)+rnd(3);
  if(!tok)tok=rnd(16);
  try{localStorage.sid=id;localStorage.stok=tok}catch(e){}
  await identSet(db,'sid',id);await identSet(db,'stok',tok);
  return{id:async()=>id,tok}}

function payDraw(id){const o=S.shop.orders.find(x=>x.id===id),c=S.shop.cfg;if(!o)return;const card=c.card.replace(/(\d{4})(?=\d)/g,'$1 ');
shw(`<h3 style="margin-top:2px">Оплата заказа №${o.n}</h3><div class="gl card" style="text-align:center"><div class="mu">К оплате</div><b style="font-size:28px">${o.rub} ₽</b><div class="mu">за ${o.amt} ★</div></div><div class="grp"><div class="sw" onclick="cpy('${c.card}')"><span>Карта</span><b>${card}</b></div>${c.holder?`<div class="sw"><span>Получатель</span><span>${E(c.holder)}</span></div>`:''}${c.bank?`<div class="sw"><span>Банк</span><span>${E(c.bank)}</span></div>`:''}</div><p class="mu" style="line-height:1.4">Переведите ровно <b>${o.rub} ₽</b> на эту карту (нажмите на номер, чтобы скопировать), затем нажмите «Я оплатил(а)». Владелец проверит перевод, и ★ придут вам в чат «Сириус Бот».</p>${c.url?`<button class="btn g" style="width:100%;margin-bottom:8px" onclick="payGo('${o.id}')">Открыть оплату в банке</button>`:''}<input id="pn" placeholder="Имя отправителя или последние 4 цифры вашей карты"><button class="btn" style="width:100%;margin-top:6px" onclick="paid('${o.id}')">Я оплатил(а)</button><button class="btn g" style="width:100%;margin-top:6px" onclick="cnl('${o.id}')">Отменить заказ</button>`)}
const payGo=id=>{const o=S.shop.orders.find(x=>x.id===id),u=S.shop.cfg.url.replace('{amount}',o.rub).replace('{order}',o.n);try{window.open(u,'_blank')}catch(e){cpy(u)}};
async function paid(id){const note=($('#pn')||{}).value||'';try{await api('/api/shop/paid',{id,note});await shopLoad();$('#shw')&&$('#shw').remove();toast('Спасибо! Владелец проверит оплату — ★ придут в чат «Сириус Бот»')}catch(e){toast(e.message)}}
async function cnl(id){try{await api('/api/shop/cancel',{id});await shopLoad();shopDraw()}catch(e){toast(e.message)}}
async function devCode(){if(!E2())return toast('Нужно подключение к серверу');if(S.shop&&S.shop.admin)return devPanel();const c=await ask('Код разработчика','','Введите код','password');if(!c)return;
try{const r=await api('/api/dev/redeem',{code:c});S.bal=r.bal;await shopLoad();toast('Режим разработчика включён');devPanel()}catch(e){toast(e.message)}}
/* ===== Панель разработчика (все действия проверяются на сервере) ===== */
const dRow=(ico,t,fn)=>`<div class="sw" onclick="${fn}"><span class="ri">${ic(ico)}</span><span style="flex:1">${t}</span></div>`;
function devPanel(){shw(`<h3 style="margin-top:2px">Панель разработчика</h3><div class="grp">${dRow('eye','Статистика сервера','devStats()')}${dRow('users','Пользователи и модерация','devUsers()')}${dRow('star','Заказы ★ на проверку','admOpen()')}${dRow('plus','Выдать ★ пользователю','admGrant()')}${dRow('x','Забрать ★ у пользователя','devTake()')}${dRow('gift','Магазин подарков (бесплатно)','shopOpen()')}${dRow('send','Рассылка от «Сириус Бот»','devBc()')}${dRow('bell','Объявление для всех','devNotice()')}${dRow('pen','Курс и лимиты ★','devCfg()')}${dRow('feed','Журнал операций','devAudit()')}</div><div class="grp">${dRow('out','Выйти из режима разработчика','devOff()')}</div>`)}
async function devStats(){try{const r=await api('/api/admin/stats',{}),up=t=>{const d=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60);return(d?d+' д ':'')+h+' ч '+m+' мин'};
const rows=[['Пользователей',r.users],['Сейчас онлайн',r.online],['Заходили за 24 ч',r.day],['Заходили за 7 дней',r.week],['Сообщений',r.msgs],['Постов',r.posts],['Историй',r.stories],['Групп / каналов',r.groups+' / '+r.channels],['Подарков отправлено',r.gifts],['★ на всех балансах',r.stars],['Заказов ждут',r.pending],['Заблокировано',r.banned],['С галочкой ✓',r.verified],['Разработчиков',r.admins],['Файлов медиа',r.media],['Размер базы',r.dbKb+' КБ'],['Память',r.memMb+' МБ'],['Работает',up(r.uptime)],['Node.js',r.node]];
shw(`<h3 style="margin-top:2px">Статистика сервера</h3><div class="grp">${rows.map(x=>`<div class="sw"><span>${x[0]}</span><b>${E(x[1])}</b></div>`).join('')}</div><button class="btn g" style="width:100%" onclick="devPanel()">Назад</button>`)}catch(e){toast(e.message)}}
async function devUsers(q){if(q===undefined){q=await ask('Поиск пользователя','','@username или имя (пусто — последние)');if(q===null)return}S.dq=q;
try{const r=await api('/api/admin/users',{q});S.dul=r.users;shw(`<h3 style="margin-top:2px">Пользователи</h3>${r.users.map((x,i)=>`<div class="row" style="padding:8px" onclick="devUser(${i})"><div class="fl"><b>${E(x.name)}${x.vf?' ✓':''}${x.banned?' 🚫':''}${x.admin?' 🛡️':''}</b><small>@${E(x.un)} · ${x.ph||'без номера'} · ★ ${x.bal} · ${x.seen?new Date(x.seen).toLocaleString('ru',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'не заходил'}</small></div></div>`).join('')||'<div class="mu" style="padding:6px 4px">Никого не найдено</div>'}<button class="btn g" style="width:100%;margin-top:6px" onclick="devUsers()">Искать ещё</button><button class="btn g" style="width:100%;margin-top:6px" onclick="devPanel()">Назад</button>`)}catch(e){toast(e.message)}}
function devUser(i){const x=(S.dul||[])[i];if(!x)return;const call=(p,b,ok)=>api('/api/admin/'+p,{un:x.un,...b}).then(()=>{toast(ok||'Готово');devUsers(S.dq)}).catch(e=>toast(e.message));
const num=async(t)=>{const a=await ask(t,'100','Количество');return a?Math.floor(+a)||0:0};
sheet([[x.vf?'Снять галочку ✓':'Выдать галочку ✓',()=>call('vf',{on:!x.vf}),'star'],[x.banned?'Разблокировать вход':'Заблокировать вход',()=>call('ban',{on:!x.banned}),'ban',!x.banned],['Выдать ★',async()=>{const n=await num('Сколько ★ выдать?');n&&call('grant',{amt:n},'Выдано')},'plus'],['Забрать ★',async()=>{const n=await num('Сколько ★ забрать?');n&&call('take',{amt:n},'Списано')},'x'],['Сменить @username',async()=>{const n=await ask('Новый @username',x.un);n&&call('setun',{nu:n},'Username изменён')},'pen'],
['Удалить все его посты',async()=>{if(await cf('Удалить все посты @'+x.un+'?','','Удалить'))call('purge',{what:'posts'},'Посты удалены')},'trash',1],['Удалить все его истории',async()=>{if(await cf('Удалить все истории @'+x.un+'?','','Удалить'))call('purge',{what:'stories'},'Истории удалены')},'trash',1],['Удалить все его сообщения',async()=>{if(await cf('Удалить ВСЕ сообщения @'+x.un+' у всех?','Действие необратимо.','Удалить'))call('purge',{what:'msgs'},'Сообщения удалены')},'trash',1],['Удалить аккаунт',async()=>{if(await cf('Удалить аккаунт @'+x.un+'?','Профиль, посты, истории, ★ и друзья будут удалены, вход закрыт.','Удалить'))call('deluser',{},'Аккаунт удалён')},'ban',1]])}
async function devTake(){const un=await ask('У кого забрать ★?','','@username');if(!un)return;const a=await ask('Сколько ★ забрать?','100','Количество');if(a===null)return;try{const r=await api('/api/admin/take',{un,amt:Math.floor(+a)||0});toast('Списано: '+r.taken+' ★')}catch(e){toast(e.message)}}
async function devBc(){const t=await ask('Рассылка всем пользователям','','Текст сообщения от «Сириус Бот»');if(!t||!t.trim())return;if(!await cf('Отправить всем пользователям?',t.slice(0,200),'Отправить'))return;try{const r=await api('/api/admin/broadcast',{text:t});toast('Отправлено: '+r.n)}catch(e){toast(e.message)}}
async function devNotice(){const t=await ask('Объявление для всех (пусто — убрать)',S.notice||'','Текст объявления');if(t===null)return;try{await api('/api/admin/notice',{text:t});toast(t.trim()?'Объявление опубликовано':'Объявление убрано')}catch(e){toast(e.message)}}
async function devCfg(){await shopLoad();const c=(S.shop||{}).cfg;if(!c)return toast('Нет данных');const r=await ask('Цена 1 ★ в рублях',String(c.rate),'₽ за 1 ★');if(r===null)return;const mi=await ask('Минимум ★ в заказе',String(c.min),'Минимум');if(mi===null)return;const ma=await ask('Максимум ★ в заказе',String(c.max),'Максимум');if(ma===null)return;
try{await api('/api/admin/cfg',{rate:+String(r).replace(',','.'),min:+mi,max:+ma});await shopLoad();toast('Сохранено')}catch(e){toast(e.message)}}
async function devAudit(){try{const r=await api('/api/admin/audit',{});shw(`<h3 style="margin-top:2px">Журнал операций</h3><div class="grp">${r.log.map(a=>`<div class="sw" style="align-items:flex-start"><span style="flex:1;font-size:13px"><b>@${E(a.un)}</b> · ${E(a.why)}<br><span class="mu">${new Date(a.t).toLocaleString('ru',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span></span><b>${a.n?(a.n>0?'+':'')+a.n+' ★':''}</b></div>`).join('')||'<div class="mu" style="padding:8px">Пусто</div>'}</div><button class="btn g" style="width:100%" onclick="devPanel()">Назад</button>`)}catch(e){toast(e.message)}}
async function devOff(){if(!await cf('Выйти из режима разработчика?','Включить снова можно по коду.','Выйти'))return;try{await api('/api/dev/off',{});await shopLoad();$('#shw')&&$('#shw').remove();toast('Режим разработчика выключен')}catch(e){toast(e.message)}}
async function admOpen(){try{const r=await api('/api/admin/list',{});shw(`<h3 style="margin-top:2px">Заказы на проверку</h3>${r.orders.map(o=>`<div class="gl card" style="margin-bottom:8px"><b>№${o.n} · @${E(o.un||'?')}</b><div>${o.amt} ★ · ${o.rub} ₽</div><div class="mu">${o.st==='claimed'?'Отметил оплату':'Оплату ещё не отметил'}${o.note?' · '+E(o.note):''}</div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" style="flex:1" onclick="admDo('confirm','${o.id}')">Деньги пришли</button><button class="btn r" onclick="admDo('reject','${o.id}')">✕</button></div></div>`).join('')||'<div class="mu" style="padding:6px 4px">Нет заказов</div>'}<button class="btn g" style="width:100%" onclick="admGrant()">Выдать ★ пользователю</button><button class="btn g" style="width:100%;margin-top:6px" onclick="devPanel()">Назад</button>`)}catch(e){toast(e.message)}}
async function admDo(a,id){const ok=a==='confirm'?await cf('Подтвердить поступление денег?','★ будут зачислены, пользователь получит сообщение от бота.','Подтвердить'):await cf('Отклонить заказ?','Пользователь получит уведомление от бота.','Отклонить');if(!ok)return;try{await api('/api/admin/'+a,{id});admOpen()}catch(e){toast(e.message)}}
async function admGrant(){const un=await ask('Кому выдать ★?','','@username');if(!un)return;const a=await ask('Сколько ★?','100','Количество');if(a===null)return;try{await api('/api/admin/grant',{un,amt:Math.floor(+a)||0});toast('Выдано');admOpen()}catch(e){toast(e.message)}}
const gfb=i=>{const L=(S.GF||[]).filter(g=>g.to===i).sort((a,b)=>b.r-a.r||b.t-a.t);return L.length?`<h3 style="text-align:left">Подарки · ${L.length}</h3><div class="gfl">${L.slice(0,24).map(g=>`<div class="gt r${g.r}" onclick="gtip('${g.id}')">${g.e}</div>`).join('')}</div>`:''};
const gtip=id=>{const g=(S.GF||[]).find(x=>x.id===id);if(g)toast(g.e+' '+g.n+' · '+RAR[g.r]+' №'+g.k+(g.s?' из '+g.s:'')+' · от '+usr(g.from).name)};
/* boot */
S.loc={l_nrcpt:localStorage.cl_nrcpt==='1',l_snd:localStorage.cl_snd!=='',l_prev:1,l_enter:localStorage.cl_enter!=='',l_big:localStorage.cl_big==='1'};
let bootN=0;
function retryNow(){clearInterval(S._iv);clearTimeout(S._bt);S.boff=0;boot()}
async function boot(){
  const myN=++bootN,base=srvBase();S.base=base;
  if(!base)return R();/* первый запуск / явный выбор "только на этом устройстве" — экран выбора сервера, как раньше */
  if(base!=='local')$('#app').innerHTML=loadScreen(S.boff?'Переподключение…':'Подключение к серверу…');
  try{
    const us=await LUSER(),id=await us.id();S.tok=us.tok;
    try{const j=localStorage.spk;if(j&&window.crypto&&crypto.subtle)await setPriv(JSON.parse(j))}catch(e){}
    const db=base==='local'?await LDB():await RDB(base,id,us.tok);
    if(myN!==bootN)return;/* подключение успело устареть (например, успел сработать повторный запуск) */
    S.db=db;S.id=id;S.boff=0;S.err=0;
    const rf=n=>{if(!S.rec&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)))R();else if(S.chat&&n==='msgs'&&!S.rec){const v=$('#ti')?.value;CH();$('#ti').value=v||'';$('#ti').focus({preventScroll:true});tb()}},sub=(n,f)=>db.collection(n).onSnapshot(s=>{f(s.docs.map(d=>({id:d.id,...d.data()})));rf(n)});
    const obj=(a,f)=>Object.fromEntries(a.map(x=>[f(x),x]));
    sub('users',a=>{S.U=obj(a,x=>x.id);fm2()});sub('friends',a=>{const o=S.F;S.F=obj(a,x=>x.id);if(S.fready)a.filter(f=>f.to===S.id&&f.st==='p'&&!o[f.id]).forEach(f=>notify(usr(f.from).name,'хочет добавить вас в друзья',()=>{S.chat=null;S.chv=0;S.view=f.from;R()}));S.fready=1});sub('blocks',a=>S.B=obj(a,x=>x.id));sub('posts',a=>S.P=a);sub('groups',a=>{S.G=obj(a,x=>x.id);chkh()});sub('stories',a=>S.ST=a);sub('calls',a=>{S.CL=obj(a,x=>x.id);cl()});sub('gifts',a=>S.GF=a);db.collection('msgs').onSnapshot(async s=>{const q=S.mq=(S.mq||0)+1,a=await Promise.all(s.docs.map(d=>dm({id:d.id,...d.data()})));if(q!==S.mq)return;const old=new Set((S.MR||[]).map(x=>x.id));S.MR=a;fm2();if(S.mready)ntf(a.filter(m=>!old.has(m.id)));S.mready=1;rf('msgs')});
    R();shopLoad();connState('online');pingLoop();const beat=()=>mu().name&&!mu().invisible&&db.collection('users').doc(S.id).update({seen:Date.now()});setInterval(beat,30000);setTimeout(beat,2500)
  }catch(e){
    if(myN!==bootN)return;
    S.err=1;S.db=null;
    if(base==='local'){R();return}
    /* нет сети/сервер недоступен: вместо системной страницы браузера показываем свой экран загрузки
       с автопереподключением (растущий интервал, максимум 15с) — пользователю ничего делать не нужно */
    const wait=Math.min(2+(S.boff=(S.boff||0)+1)*2,15);let left=wait;
    const tick=()=>{$('#app').innerHTML=loadScreen('Нет соединения с сервером',Math.max(left,0));left--};
    tick();S._iv=setInterval(tick,1000);S._bt=setTimeout(()=>{clearInterval(S._iv);boot()},wait*1000)
  }
}
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});/* кэш оболочки для офлайн-экрана загрузки, не только для push */
boot();
</script></body></html>
